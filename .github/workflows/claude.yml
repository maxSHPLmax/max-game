name: Claude

# Агент просыпается, когда в issue или комментарии упомянут @claude.
# Он читает CLAUDE.md, правит файлы и открывает pull request.
# В main ничего не попадает без твоего мержа.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))

    runs-on: ubuntu-latest
    timeout-minutes: 20        # страховка от зависшего прогона

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Запустить агента
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
