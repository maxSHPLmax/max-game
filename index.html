<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night:  #0f0f1b;
    --panel:  #1b1b2e;
    --edge:   #2e2e4a;
    --gold:   #ffcc33;
    --mint:   #4ec9b0;
    --text:   #e8e6e3;
    --muted:  #8b8ba7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--night);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px 16px 48px;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 3.2vw, 24px);
    color: var(--gold);
    margin: 0;
    letter-spacing: 1px;
    text-shadow: 0 3px 0 #a8791a;
  }

  #game {
    border: 3px solid var(--edge);
    border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    line-height: 0;
    max-width: 100%;
  }

  #game canvas { max-width: 100%; height: auto; }

  .hint {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    max-width: 620px;
    line-height: 1.7;
    margin: 0;
  }

  kbd {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 2px 7px;
    font-family: 'IBM Plex Sans', monospace;
    font-size: 12px;
    color: var(--text);
  }

  #version {
    position: fixed;
    bottom: 10px;
    right: 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--muted);
    opacity: 0.7;
  }
</style>
</head>
<body>

  <h1>MAX GAME</h1>

  <div id="game"></div>

  <p class="hint">
    <kbd>&larr;</kbd> <kbd>&rarr;</kbd> идти &nbsp;·&nbsp;
    <kbd>Space</kbd> прыгнуть &nbsp;·&nbsp;
    <kbd>R</kbd> начать уровень заново
    <br>
    Собери монеты и дойди до флага. Прогресс сохраняется в браузере.
  </p>

  <div id="version">v0.1.0</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/save.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
