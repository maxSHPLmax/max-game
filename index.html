<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Max Game — браузерная бродилка</title>
<meta name="description" content="Сиба-ину собирает косточки. Новый уровень каждую неделю.">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Max Game">
<meta property="og:title" content="Max Game — браузерная бродилка">
<meta property="og:description" content="Сиба-ину собирает косточки. Новый уровень каждую неделю.">
<meta property="og:url" content="https://maxshplmax.github.io/max-game/">
<meta property="og:image" content="https://maxshplmax.github.io/max-game/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-game">

  <header class="bar bar-top">
    <span class="brand">MAX GAME</span>
    <nav class="bar-links">
      <a href="changelog.html">Обновления</a>
      <a href="https://github.com/maxshplmax/max-game">GitHub</a>
      <span id="version"></span>
    </nav>
  </header>

  <main id="game">
    <!-- экранные кнопки: показываются только на сенсорных устройствах -->
    <div class="touchpad" id="touch" hidden>
      <div class="tp-move">
        <button class="tp-btn" id="btn-left"  type="button" aria-label="Влево">&#9664;</button>
        <button class="tp-btn" id="btn-right" type="button" aria-label="Вправо">&#9654;</button>
      </div>
      <div class="tp-act">
        <button class="tp-btn tp-small" id="btn-restart" type="button" aria-label="Начать заново">&#8635;</button>
        <button class="tp-btn tp-jump"  id="btn-jump"    type="button" aria-label="Прыжок">&#9650;</button>
      </div>
    </div>
  </main>

  <footer class="bar bar-bottom">
    <span class="controls">
      <kbd>&larr;</kbd><kbd>&rarr;</kbd> идти
      <kbd>Space</kbd> прыжок
      <kbd>R</kbd> заново
    </span>
    <span class="rotate-hint">Поверни телефон — играть будет удобнее</span>
    <span class="whats-new" id="whats-new"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="changelog.js"></script>
  <script src="src/site.js"></script>
  <script src="src/touch.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/save.js"></script>
  <script src="src/run.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
